<div class="layout">
    <header class="navbar" [class.collapsed]="!isSidebarOpen">
        <div class="left">
            <button class="menu-btn" (click)="toggleSidebar()">
                <mat-icon> menu </mat-icon>
            </button>
        </div>
        
        <div class="profile-section" >
            <button class="profile-btn" (click)="toggleProfile()">
               <mat-icon>account_circle</mat-icon>
               <span> {{username}} </span>
               <mat-icon>expand_more</mat-icon>
            </button>
            
            <div class="dropdown" *ngIf="showProfile">
              <div *ngIf="role === 'Employee'">
                <button (click)="myProfile()">
                   <mat-icon>person</mat-icon> My Profile
                </button>
                </div>
                <button (click)="changePassword()">
                   <mat-icon>lock</mat-icon> Change Password
                </button>
                <hr>
                <button (click)="logout()">
                    <mat-icon>logout</mat-icon>Logout
                </button>
            </div>
        </div>
    </header>
  <!-- Sidebar -->
<aside class="sidebar" 
[class.collapsed]="!isSidebarOpen"
[class.mobile-open]="isSidebarOpen">

  <!-- Admin Menu -->
  <div *ngIf="role === 'Admin' || role === 'HR'">

    <button [routerLink]="role === 'Admin' ? '/admin-dashboard' : '/hr-dashboard'" (click)="closeSidebarOnMobile()">
      <mat-icon>dashboard</mat-icon>
      <span *ngIf="isSidebarOpen">
        Dashboard</span>
    </button>
    <div *ngIf="role ==='Admin'|| role ==='HR'">
      <button routerLink="/profile-requests" (click)="closeSidebarOnMobile()">
        <mat-icon>request_page</mat-icon>
         <span *ngIf="isSidebarOpen">
        Profile Update Requests</span>
      </button>
      <button routerLink="/application-requests" (click)="closeSidebarOnMobile()">
      <mat-icon>description</mat-icon>
      <span *ngIf="isSidebarOpen">
        Application Requests
       </span>
     </button>
    </div>


    <button routerLink="/view-employees" (click)="closeSidebarOnMobile()">
      <mat-icon>groups</mat-icon> 
      <span *ngIf="isSidebarOpen">
        View Employees</span>
    </button>

    <button routerLink="/create-employee" (click)="closeSidebarOnMobile()">
      <mat-icon>person_add</mat-icon> 
       <span *ngIf="isSidebarOpen">
        Create Employee</span>
    </button>

  </div>

  <!-- Employee Menu -->
  <div *ngIf="role === 'Employee'">

    <!-- <button routerLink="/employee-dashboard" \>
      <mat-icon>Dashboard</mat-icon>
      <span *ngIf="isSidebarOpen">
        Dashboard</span>
    </button> -->

    <button routerLink="/employee-profile" (click)="closeSidebarOnMobile()">
      <mat-icon>person</mat-icon>
      <span *ngIf="isSidebarOpen">
        My Profile</span>
    </button>
    <button routerLink="/apply-application" (click)="closeSidebarOnMobile()">
      <mat-icon>description</mat-icon>
      <span *ngIf="isSidebarOpen">
        Apply Application</span>
    </button>
     <button routerLink="/my-applications" (click)="closeSidebarOnMobile()">
      <mat-icon>assignment</mat-icon>
      <span *ngIf="isSidebarOpen">
        My Applications</span>
    </button>
     <button routerLink="/my-profile-requests" (click)="closeSidebarOnMobile()">
      <mat-icon>request_page</mat-icon>
      <span *ngIf="isSidebarOpen">
        My Profile Requests</span>
    </button>

      </div>
        <button class="sidebar-item" routerLink="/user-manual" (click)="closeSidebarOnMobile()">
    <mat-icon>menu_book</mat-icon>
     <span *ngIf="isSidebarOpen">
           User Manual</span>
    </button>

  <!-- Common Logout -->
  <button class="logout-btn" (click)="logout()">
    <mat-icon>logout</mat-icon>
     <span *ngIf="isSidebarOpen">
           Logout</span>
    </button>
    
</aside>

<!-- Mobile Overlay -->
<div
  class="overlay"
  *ngIf="isSidebarOpen && isMobile"
  (click)="closeSidebarOnMobile()">
</div>

<!-- Content -->
<main class="content"
[class.collapsed]="!isSidebarOpen">
  <router-outlet></router-outlet>
</main>
</div>
